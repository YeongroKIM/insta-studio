<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
 body{margin:0;background:#2a2826;font-family:'Gaegu',cursive;width:800px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
 .c{background:#FFFDF9;border-radius:14px;position:relative;height:330px;overflow:hidden}
 .c img{width:100%;position:absolute;bottom:0;left:0}
 .t{position:absolute;top:16px;width:100%;text-align:center;font-size:40px;color:#1A1614;letter-spacing:4px;z-index:2}
 .wide{grid-column:1/3;height:360px}
</style></head><body><div class="grid">
 <div class="c"><div class="t">어쩌다 신부</div><img src="v4-daram-veil.svg"></div>
 <div class="c"><div class="t">도토리처럼 저장!</div><img src="v4-daram-acorn.svg"></div>
 <div class="c"><div class="t">곰 . 곰 . . .</div><img src="v4-gom-sweat.svg"></div>
 <div class="c"><div class="t">예랑이 등장</div><img src="v4-gom-basic.svg"></div>
 <div class="c wide"><div class="t">우리 결혼해요 ♡</div><img src="v4-fluffy.svg" style="bottom:-40px"></div>
</div></body></html>
